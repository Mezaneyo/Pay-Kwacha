<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pay — PayKwacha</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 10px 40px rgba(15,23,42,0.08);
            margin: 0 auto;
        }

        .logo {
            text-align: center;
            font-size: 36px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .merchant {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 18px;
            word-break: break-word;
        }

        .amount-box {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 22px 16px;
            border-radius: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        .amount-label {
            font-size: 11px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .amount-value {
            font-size: 34px;
            font-weight: 800;
            margin-top: 6px;
            letter-spacing: -0.03em;
            word-break: break-all;
        }

        .description {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background: #f8fafc;
            color: #0f172a;
            -webkit-appearance: none;
            appearance: none;
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .result {
            margin-top: 14px;
            padding: 14px;
            border-radius: 10px;
            display: none;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
        }

        .result.success {
            background: #ecfdf5;
            color: #065f46;
            display: block;
            border: 1px solid #a7f3d0;
        }

        .result.error {
            background: #fef2f2;
            color: #991b1b;
            display: block;
            border: 1px solid #fecaca;
        }

        .result.pending {
            background: #fef3c7;
            color: #92400e;
            display: block;
            border: 1px solid #fde68a;
        }

        .pin-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.55;
        }

        .secured {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
        }

        .loading {
            text-align: center;
            padding: 40px 16px;
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 380px) {
            .amount-value { font-size: 28px; }
            h1 { font-size: 18px; }
            .container { padding: 20px 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="content">
        <div class="loading">⏳ Loading...</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBY_Ea_o2x6QJupbc4M2K_ES7G0D8XuvEc",
        authDomain: "primebet-a6742.firebaseapp.com",
        projectId: "primebet-a6742",
        storageBucket: "primebet-a6742.firebasestorage.app",
        messagingSenderId: "507670378832",
        appId: "1:507670378832:web:c3106d37e2027aaf1d9455"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const pathParts = window.location.pathname.split('/');
    const linkId = pathParts[pathParts.length - 1];

    let linkData = null;
    let pollTimer = null;
    let pollCount = 0;
    const MAX_POLLS = 40;

    (async () => {
        try {
            const doc = await db.collection('paymentLinks').doc(linkId).get();
            if (!doc.exists) {
                document.getElementById('content').innerHTML = `
                    <div class="logo">⚠️</div>
                    <h1>Link Not Found</h1>
                    <p class="merchant">This payment link is invalid or has expired.</p>
                `;
                return;
            }

            linkData = doc.data();

            document.getElementById('content').innerHTML = `
                <div class="logo">💳</div>
                <h1>Pay Now</h1>
                <p class="merchant">to <strong>${escapeHtml(linkData.merchantName || 'Merchant')}</strong></p>

                <div class="amount-box">
                    <div class="amount-label">Amount to pay</div>
                    <div class="amount-value">MWK ${Number(linkData.amount).toLocaleString()}</div>
                </div>

                ${linkData.description ? `<p class="description">${escapeHtml(linkData.description)}</p>` : ''}

                <div class="field">
                    <label>📱 Your Phone Number</label>
                    <input type="tel" id="phone" placeholder="0995514049" inputmode="numeric" />
                </div>

                <div class="field">
                    <label>📡 Provider</label>
                    <select id="provider">
                        <option value="AIRTEL_MWI">Airtel Money</option>
                        <option value="TNM_MWI">TNM Mpamba</option>
                    </select>
                </div>

                <button class="btn" id="payBtn" onclick="payNow()">Pay MWK ${Number(linkData.amount).toLocaleString()}</button>
                <div class="result" id="result"></div>

                <div class="secured">🔒 Secured by PayChangu</div>
            `;
        } catch (err) {
            document.getElementById('content').innerHTML = `
                <div class="logo">⚠️</div>
                <h1>Error</h1>
                <p class="merchant">${escapeHtml(err.message)}</p>
            `;
        }
    })();

    async function payNow() {
        const phone = document.getElementById('phone').value.trim();
        const provider = document.getElementById('provider').value;
        const btn = document.getElementById('payBtn');
        const result = document.getElementById('result');

        if (!phone) {
            result.className = 'result error';
            result.textContent = 'Please enter your phone number';
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ Sending...';
        result.className = 'result';
        result.textContent = '';

        try {
            // Look up the merchant's API key from Firestore
            const merchantDoc = await db.collection('businesses').doc(linkData.userId).get();
            if (!merchantDoc.exists) {
                result.className = 'result error';
                result.textContent = 'Merchant not found';
                btn.disabled = false;
                btn.textContent = `Pay MWK ${Number(linkData.amount).toLocaleString()}`;
                return;
            }

            const merchantApiKey = merchantDoc.data().apiKey;
            if (!merchantApiKey) {
                result.className = 'result error';
                result.textContent = 'Merchant has no API key';
                btn.disabled = false;
                btn.textContent = `Pay MWK ${Number(linkData.amount).toLocaleString()}`;
                return;
            }

            const res = await fetch('/api/payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    apiKey: merchantApiKey,
                    phoneNumber: phone,
                    amount: String(linkData.amount),
                    provider: provider,
                    email: 'customer@paykwacha.com'
                })
            });

            const data = await res.json();

            if (data.success) {
                result.className = 'result pending';
                result.innerHTML = `
                    <strong>⏳ Prompt sent!</strong><br>
                    <div class="pin-box">
                        <strong>📲 Check your phone</strong><br>
                        Enter your PIN to authorize MWK ${Number(linkData.amount).toLocaleString()}.<br><br>
                        <strong>Status:</strong> <span id="pollStatus">Waiting...</span>
                    </div>
                `;
                startPolling(data.chargeId, { phone, amount: linkData.amount });
            } else {
                result.className = 'result error';
                result.textContent = data.error || 'Payment failed';
                btn.disabled = false;
                btn.textContent = `Pay MWK ${Number(linkData.amount).toLocaleString()}`;
            }
        } catch (err) {
            result.className = 'result error';
            result.textContent = 'Error: ' + err.message;
            btn.disabled = false;
            btn.textContent = `Pay MWK ${Number(linkData.amount).toLocaleString()}`;
        }
    }

    function startPolling(chargeId, meta) {
        pollCount = 0;
        pollTimer = setInterval(async () => {
            pollCount++;

            if (pollCount > MAX_POLLS) {
                clearInterval(pollTimer);
                document.getElementById('result').className = 'result error';
                document.getElementById('result').innerHTML = `
                    <strong>⏰ Timed out</strong><br>
                    The prompt was not authorized in time.<br>
                    <strong>No money was deducted.</strong>
                `;
                return;
            }

            try {
                const res = await fetch('/api/payment-status/' + encodeURIComponent(chargeId));
                const data = await res.json();
                const status = (data.status || '').toLowerCase();

                if (status === 'success' || status === 'successful' || status === 'completed') {
                    clearInterval(pollTimer);
                    document.getElementById('result').className = 'result success';
                    document.getElementById('result').innerHTML = `
                        <strong>✅ Payment Successful!</strong><br><br>
                        <strong>Amount:</strong> MWK ${Number(meta.amount).toLocaleString()}<br>
                        <strong>Phone:</strong> ${escapeHtml(meta.phone)}<br><br>
                        🎉 Thank you!
                    `;
                } else if (status === 'failed' || status === 'cancelled' || status === 'rejected') {
                    clearInterval(pollTimer);
                    document.getElementById('result').className = 'result error';
                    document.getElementById('result').innerHTML = `
                        <strong>❌ Payment Failed</strong><br>
                        This could be:<br>
                        • Wrong PIN<br>
                        • Insufficient balance<br>
                        • Cancelled<br><br>
                        <strong>No money was deducted.</strong>
                    `;
                }
            } catch (err) {
                console.warn('Poll error:', err.message);
            }
        }, 3000);
    }

    function escapeHtml(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
</script>

</body>
</html>
