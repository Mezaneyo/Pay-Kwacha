<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Key — PayKwacha</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #f8fafc;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 560px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 10px 40px rgba(15,23,42,0.08);
        }
        h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .sub { color: #64748b; font-size: 13px; margin-bottom: 22px; }
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .field input, .field select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background: #f8fafc;
            font-family: inherit;
        }
        .field input:focus, .field select:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
        }
        .btn:disabled { opacity: 0.5; }
        .result {
            display: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 14px;
            word-break: break-word;
        }
        .result.show { display: block; }
        .result.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .result.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .result.pending { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .result pre {
            background: rgba(0,0,0,0.06);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            overflow-x: auto;
            margin-top: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🧪 Test API Key</h1>
        <p class="sub">Verify your PayKwacha API key works</p>

        <div class="field">
            <label>API Key</label>
            <input type="text" id="apiKey" value="PK_1790811114488_451BSHFR" />
        </div>

        <div class="field">
            <label>Phone Number</label>
            <input type="tel" id="phone" value="0995514049" />
        </div>

        <div class="field">
            <label>Amount (MWK)</label>
            <input type="number" id="amount" value="50" min="50" />
        </div>

        <div class="field">
            <label>Provider</label>
            <select id="provider">
                <option value="AIRTEL_MWI">Airtel Money</option>
                <option value="TNM_MWI">TNM Mpamba</option>
            </select>
        </div>

        <button class="btn" id="btn" onclick="testApi()">Send Test Payment →</button>

        <div class="result" id="result"></div>
    </div>
</div>

<script>
    async function testApi() {
        const btn = document.getElementById('btn');
        const result = document.getElementById('result');

        const apiKey = document.getElementById('apiKey').value.trim();
        const phoneNumber = document.getElementById('phone').value.trim();
        const amount = document.getElementById('amount').value.trim();
        const provider = document.getElementById('provider').value;

        btn.disabled = true;
        btn.textContent = 'Sending...';
        result.className = 'result';
        result.textContent = '';

        try {
            const res = await fetch('/api/payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ apiKey, phoneNumber, amount, provider })
            });

            const data = await res.json();

            if (data.success) {
                result.className = 'result show success';
                result.innerHTML = `
                    <strong>✅ API Key Works!</strong><br><br>
                    <strong>Charge ID:</strong> ${data.chargeId}<br>
                    <strong>Status:</strong> ${data.status}<br>
                    <strong>Message:</strong> ${data.message || 'Prompt sent'}<br><br>
                    <strong>🎯 Check your phone for the payment prompt.</strong>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } else {
                result.className = 'result show error';
                result.innerHTML = `
                    <strong>❌ API Error</strong><br><br>
                    <strong>Message:</strong> ${data.error}<br>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            }
        } catch (err) {
            result.className = 'result show error';
            result.innerHTML = `<strong>Network Error:</strong> ${err.message}`;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Send Test Payment →';
        }
    }
</script>

</body>
</html>
