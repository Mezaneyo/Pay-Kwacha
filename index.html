<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pawaPay API Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #6c3fc5;
            margin-bottom: 5px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: #6c3fc5;
            outline: none;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 13px;
            font-family: monospace;
            resize: vertical;
            min-height: 70px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #6c3fc5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }

        .btn:hover { background: #5a32a8; }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e94560;
        }

        .btn-secondary:hover { background: #c73652; }

        .output {
            background: #1a1a2e;
            color: #00ff9f;
            font-family: monospace;
            font-size: 13px;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .output .success { color: #00ff9f; }
        .output .error { color: #ff5757; }
        .output .info { color: #6ec1ff; }
        .output .warning { color: #ffcc00; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status-badge.sandbox {
            background: #ffe0b2;
            color: #e65100;
        }

        .result-box {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
        }

        .result-box.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .result-box.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .loader.active { display: block; }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6c3fc5;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧪 pawaPay API Test</h1>
    <p class="subtitle">Test your pawaPay token directly from your browser</p>

    <div style="text-align:center;">
        <span class="status-badge sandbox">🔶 SANDBOX MODE</span>
    </div>

    <!-- API TOKEN -->
    <div class="form-group">
        <label>🔑 pawaPay API Token (JWT)</label>
        <textarea id="token" placeholder="Paste your JWT token here...">eyJraWQiOiIxIiwiYWxnIjoiRVMyNTYifQ.eyJ0dCI6IkFBVCIsInN1YiI6IjI4NzU2IiwibWF2IjoiMSIsImV4cCI6MjEwNDY5NDE1OSwiaWF0IjoxNzg5MDc0OTU5LCJwbSI6IkRBRixQQUYiLCJqdGkiOiI5YjdmOTZmYS1lZjhiLTQ3MTYtOWE5ZS0zZjdhOGRlYjkwNTAifQ.8sfOu1IN0qNI8eXYMYZMui0oum2BZ82BbaSoIyu11MSVmMSbb6So56hNuX1zeC-vuhxUUSbCKsuHOp3UbL3WYA</textarea>
    </div>

    <!-- PHONE NUMBER -->
    <div class="form-group">
        <label>📱 Customer Phone Number</label>
        <input type="tel" id="phone" value="265888123456" placeholder="265888123456" />
    </div>

    <!-- AMOUNT -->
    <div class="form-group">
        <label>💰 Amount (MWK)</label>
        <input type="number" id="amount" value="1000" min="1" />
    </div>

    <!-- PROVIDER -->
    <div class="form-group">
        <label>🏢 Mobile Money Provider</label>
        <select id="provider">
            <option value="AIRTEL_MWI">Airtel Money (Malawi)</option>
            <option value="TNM_MWI">TNM Mpamba (Malawi)</option>
        </select>
    </div>

    <!-- BUTTONS -->
    <button class="btn" id="testTokenBtn" onclick="testToken()">
        ✅ Test 1: Check Token
    </button>

    <button class="btn btn-secondary" id="testPaymentBtn" onclick="testPayment()">
        💸 Test 2: Initiate Payment
    </button>

    <!-- LOADER -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- RESULT -->
    <div class="result-box" id="result"></div>

    <!-- RAW OUTPUT LOG -->
    <div class="output" id="output">Ready. Click a test button above to begin...</div>

    <div class="footer">🇲🇼 PayKwacha • pawaPay Test Tool</div>
</div>

<script>
    // ============================================
    // 🌐 API Configuration
    // ============================================
    const BASE_URL = 'https://api.sandbox.pawapay.io';

    // ============================================
    // 🛠️ Helpers
    // ============================================
    function log(message, type = 'info') {
        const output = document.getElementById('output');
        const time = new Date().toLocaleTimeString();
        const colors = {
            info: '#6ec1ff',
            success: '#00ff9f',
            error: '#ff5757',
            warning: '#ffcc00'
        };
        output.innerHTML += `\n<span style="color:${colors[type]}">[${time}] ${message}</span>`;
        output.scrollTop = output.scrollHeight;
    }

    function showResult(success, message) {
        const box = document.getElementById('result');
        box.className = `result-box ${success ? 'success' : 'error'}`;
        box.innerHTML = message;
    }

    function setLoading(active) {
        document.getElementById('loader').classList.toggle('active', active);
        document.getElementById('testTokenBtn').disabled = active;
        document.getElementById('testPaymentBtn').disabled = active;
    }

    function getToken() {
        return document.getElementById('token').value.trim();
    }

    // ============================================
    // 🧪 TEST 1: Check Token Validity
    // ============================================
    async function testToken() {
        const token = getToken();
        if (!token) {
            showResult(false, '❌ Please paste your pawaPay API token first.');
            return;
        }

        log('Testing token validity...', 'info');
        setLoading(true);
        document.getElementById('result').className = 'result-box';

        try {
            const response = await fetch(`${BASE_URL}/active-conf`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json();

            if (response.ok) {
                log('✅ Token is VALID!', 'success');
                log('Response: ' + JSON.stringify(data, null, 2), 'success');
                showResult(true,
                    `✅ <strong>Token is VALID!</strong><br /><br />` +
                    `Your pawaPay token is working correctly.<br /><br />` +
                    `<strong>Active configuration:</strong><br />` +
                    `<pre style="background:#f5f5f5;padding:10px;border-radius:6px;font-size:12px;overflow-x:auto;">${JSON.stringify(data, null, 2)}</pre>`
                );
            } else {
                log(`❌ Token invalid. HTTP ${response.status}`, 'error');
                log('Error: ' + JSON.stringify(data), 'error');
                showResult(false,
                    `❌ <strong>Token check failed</strong><br /><br />` +
                    `HTTP ${response.status}: ${data.message || JSON.stringify(data)}`
                );
            }
        } catch (error) {
            log('❌ Network error: ' + error.message, 'error');
            showResult(false,
                `❌ <strong>Network error</strong><br /><br />${error.message}<br /><br />` +
                `This could be a CORS issue or your internet connection.`
            );
        } finally {
            setLoading(false);
        }
    }

    // ============================================
    // 🧪 TEST 2: Initiate Payment
    // ============================================
    async function testPayment() {
        const token = getToken();
        const phone = document.getElementById('phone').value.trim();
        const amount = document.getElementById('amount').value.trim();
        const provider = document.getElementById('provider').value;

        if (!token || !phone || !amount) {
            showResult(false, '❌ Please fill in all fields.');
            return;
        }

        // Format phone to 265XXXXXXXXX
        let formattedPhone = phone.replace(/\s/g, '').replace('+', '');
        if (formattedPhone.startsWith('0')) {
            formattedPhone = '265' + formattedPhone.substring(1);
        } else if (!formattedPhone.startsWith('265')) {
            formattedPhone = '265' + formattedPhone;
        }

        const depositId = `TEST-${Date.now()}`;

        const payload = {
            depositId: depositId,
            amount: amount.toString(),
            currency: 'MWK',
            payer: {
                type: 'MMO',
                accountDetails: {
                    phoneNumber: formattedPhone,
                    provider: provider
                }
            },
            customerMessage: 'PayKwacha Test Payment'
        };

        log('Initiating payment...', 'info');
        log('Payload: ' + JSON.stringify(payload), 'info');
        setLoading(true);
        document.getElementById('result').className = 'result-box';

        try {
            const response = await fetch(`${BASE_URL}/deposits`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                log('✅ Payment request ACCEPTED!', 'success');
                log('Response: ' + JSON.stringify(data, null, 2), 'success');
                showResult(true,
                    `✅ <strong>Payment request accepted!</strong><br /><br />` +
                    `📱 Phone: ${formattedPhone}<br />` +
                    `💰 Amount: MWK ${amount}<br />` +
                    `🏢 Provider: ${provider}<br />` +
                    `📝 Deposit ID: ${depositId}<br /><br />` +
                    `<strong>Response:</strong><br />` +
                    `<pre style="background:#f5f5f5;padding:10px;border-radius:6px;font-size:12px;overflow-x:auto;">${JSON.stringify(data, null, 2)}</pre>`
                );
            } else {
                log(`❌ Payment rejected. HTTP ${response.status}`, 'error');
                log('Error: ' + JSON.stringify(data, null, 2), 'error');
                showResult(false,
                    `❌ <strong>Payment failed</strong><br /><br />` +
                    `HTTP ${response.status}<br />` +
                    `<pre style="background:#f5f5f5;padding:10px;border-radius:6px;font-size:12px;overflow-x:auto;">${JSON.stringify(data, null, 2)}</pre>`
                );
            }
        } catch (error) {
            log('❌ Network error: ' + error.message, 'error');
            showResult(false,
                `❌ <strong>Network error</strong><br /><br />${error.message}<br /><br />` +
                `<strong>Likely cause: CORS.</strong><br /><br />` +
                `pawaPay's API may not allow direct browser requests for security reasons. ` +
                `If so, you'll need to run this test from a backend server (Node.js) instead.`
            );
        } finally {
            setLoading(false);
        }
    }

    // ============================================
    // 🚀 Auto-run initial log
    // ============================================
    log('pawaPay Test Tool loaded', 'info');
    log('Base URL: ' + BASE_URL, 'info');
    log('Click "Test 1: Check Token" to begin.', 'warning');
</script>
</body>
</html>
